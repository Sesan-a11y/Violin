<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Una pregunta especial 🎻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #FDFBF7;
        --pink-soft: #FDECEF;
        --wine: #722F37;
        --wine-soft: #A9636C;
        --wood: #8B5A2B;
        --gold: #C9A24D;
        --text-dark: #3A3230;
        --white: #FFFFFF;
        --string: rgba(114, 47, 55, 0.16);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body { height: 100%; }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, var(--bg-color) 0%, var(--pink-soft) 100%);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    h1, h2 {
        font-family: 'Playfair Display', serif;
        color: var(--wine);
        text-align: center;
        margin-bottom: 20px;
    }

    /* ---------- cuerdas de fondo, en tono pastel, siempre vibrando ---------- */
    .staff-wrap {
        position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
        z-index: 0; pointer-events: none; opacity: 0.9;
    }
    .staff-wrap svg { width: 100%; height: auto; display: block; }
    .staff-line { fill: none; stroke: var(--string); stroke-width: 1.4; }

    .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        padding: 30px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
    }

    .hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }
    .active { opacity: 1; pointer-events: all; transform: scale(1); }

    /* ---------- violín ---------- */
    .violin-container {
        position: relative;
        margin-bottom: 26px;
        animation: float 4s ease-in-out infinite;
    }

    .violin-svg {
        width: 96px;
        height: auto;
        filter: drop-shadow(0 10px 15px rgba(139, 90, 43, 0.25));
    }

    .question-text {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 1.4rem;
        line-height: 1.4;
        margin-bottom: 40px;
        z-index: 10;
        color: var(--wine);
        max-width: 320px;
        transition: opacity 0.25s ease;
    }

    .buttons-container {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
        width: 100%;
        min-height: 220px;
        z-index: 10;
    }

    button {
        font-family: 'Poppins', sans-serif;
        border: none;
        border-radius: 50px;
        padding: 15px 40px;
        font-size: 1.1rem;
        font-weight: 500;
        cursor: pointer;
        transition: left 0.32s cubic-bezier(.34,1.56,.64,1), top 0.32s cubic-bezier(.34,1.56,.64,1),
                    transform 0.28s cubic-bezier(0.25, 0.8, 0.25, 1),
                    font-size 0.28s ease, padding 0.28s ease, opacity 0.4s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 80%;
        max-width: 250px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-yes {
        background-color: var(--wine);
        color: var(--white);
    }

    .btn-no {
        background-color: var(--white);
        color: var(--wine);
        border: 1px solid var(--wine);
    }

    .btn-no.kick { animation: noKick 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes noKick {
        0%   { transform: scale(var(--s,1)) rotate(0deg); }
        25%  { transform: scale(calc(var(--s,1) * 1.18)) rotate(-9deg); }
        55%  { transform: scale(calc(var(--s,1) * 0.88)) rotate(7deg); }
        80%  { transform: scale(calc(var(--s,1) * 1.05)) rotate(-2deg); }
        100% { transform: scale(var(--s,1)) rotate(0deg); }
    }
    .btn-yes.grow { animation: yesGrow 0.4s ease; }
    @keyframes yesGrow {
        0%   { transform: scale(var(--s,1)); }
        50%  { transform: scale(calc(var(--s,1) * 1.1)); }
        100% { transform: scale(var(--s,1)); }
    }

    /* ---------- Pantalla 2 ---------- */
    .contact-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(10px);
        padding: 34px 24px;
        border-radius: 22px;
        box-shadow: 0 14px 40px rgba(114, 47, 55, 0.12);
        text-align: center;
        width: 100%;
        max-width: 350px;
        margin-top: 8px;
        border: 1px solid rgba(114, 47, 55, 0.08);
    }

    .card-label {
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--wine-soft);
        margin-bottom: 6px;
    }

    .phone-number {
        font-family: 'Playfair Display', serif;
        font-size: 1.9rem;
        color: var(--wood);
        margin: 10px 0 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
    }

    .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }

    .btn-whatsapp, .btn-copy {
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        border-radius: 50px;
        padding: 15px 40px;
        font-weight: 500;
        font-family: 'Poppins', sans-serif;
        font-size: 1.1rem;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: transform 0.25s ease, background-color 0.25s ease;
    }
    .btn-whatsapp:hover, .btn-copy:hover { transform: translateY(-2px); }

    .btn-whatsapp { background-color: #25D366; color: white; }
    .btn-copy {
        background-color: transparent;
        color: var(--wood);
        border: 1px solid var(--wood);
        box-shadow: none;
    }
    .btn-copy.copied { background-color: var(--wood); color: white; }

    .copy-caption {
        font-family: 'Playfair Display', serif;
        font-style: italic;
        font-size: 0.85rem;
        color: var(--wine-soft);
        margin-top: 10px;
        line-height: 1.4;
    }

    .final-message {
        margin-top: 18px;
        font-size: 0.85rem;
        color: #7d7370;
        font-style: italic;
    }

    .mini-bars {
        display: flex; align-items: flex-end; justify-content: center;
        gap: 4px; height: 22px; margin: 4px auto 18px; opacity: 0.55;
    }
    .mini-bars span {
        width: 3px; background: var(--gold); border-radius: 2px;
        animation: eq 1.2s ease-in-out infinite;
    }
    .mini-bars span:nth-child(1){ height:35%; animation-delay:0s; }
    .mini-bars span:nth-child(2){ height:75%; animation-delay:0.15s; }
    .mini-bars span:nth-child(3){ height:50%; animation-delay:0.3s; }
    .mini-bars span:nth-child(4){ height:90%; animation-delay:0.1s; }
    .mini-bars span:nth-child(5){ height:60%; animation-delay:0.25s; }
    @keyframes eq { 0%,100%{ transform:scaleY(0.5);} 50%{ transform:scaleY(1);} }

    /* ---------- Animaciones ---------- */
    @keyframes float {
        0% { transform: translateY(0px) rotate(-2deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(-2deg); }
    }

    .floating-element {
        position: absolute;
        pointer-events: none;
        animation: floatUp 2s forwards ease-out;
        opacity: 0;
        font-size: 1.5rem;
        z-index: 5;
        color: var(--wine-soft);
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-100px) scale(1.2) rotate(20deg); opacity: 0; }
    }

    @keyframes explodeHearts {
        0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
    }

    .exploding-heart {
        position: absolute;
        pointer-events: none;
        animation: explodeHearts 1.5s forwards cubic-bezier(0.25, 1, 0.5, 1);
        font-size: 1.5rem;
        z-index: 20;
    }

    @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }

    /* ---------- splash de apertura ---------- */
    .splash {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--bg-color) 0%, var(--pink-soft) 100%);
        overflow: hidden;
    }
    .splash.splash-hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease;
    }

    .splash-violin { width: 120px; height: auto; position: relative; z-index: 2; }
    .splash-violin.fly {
        animation: violinFly 1.35s ease forwards;
    }
    @keyframes violinFly {
        0%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
        10%  { transform: translate(-8px, 10px) rotate(-6deg) scale(1.05); opacity: 1; } /* pequeño impulso hacia atrás, como agacharse antes de volar */
        30%  { transform: translate(10vw, -10vh) rotate(10deg) scale(0.85); opacity: 1; }
        55%  { transform: translate(24vw, -26vh) rotate(20deg) scale(0.6); opacity: 0.95; }
        78%  { transform: translate(38vw, -46vh) rotate(32deg) scale(0.35); opacity: 0.6; }
        100% { transform: translate(50vw, -66vh) rotate(42deg) scale(0.12); opacity: 0; }
    }

    .splash-draw {
        fill: none;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: splashDraw 1.1s cubic-bezier(.65,0,.35,1) forwards;
    }
    .splash-draw.delay { animation-delay: 0.12s; }
    @keyframes splashDraw { to { stroke-dashoffset: 0; } }

    .splash-fill {
        opacity: 0;
        animation: splashFade 0.6s ease forwards;
        animation-delay: 0.85s;
    }
    .splash-details {
        opacity: 0;
        animation: splashFade 0.5s ease forwards;
        animation-delay: 1.05s;
    }
    @keyframes splashFade { to { opacity: 1; } }

    .splash-sweep {
        position: absolute;
        top: 50%; left: 50%;
        width: 3px; height: 140vh;
        background: linear-gradient(to bottom, transparent, var(--gold), transparent);
        transform: translate(-50%, -50%) rotate(18deg) translateX(-70vw);
        opacity: 0;
        animation: splashSweep 1.05s cubic-bezier(.5,0,.3,1) forwards;
        z-index: 1;
    }
    @keyframes splashSweep {
        0%   { transform: translate(-50%, -50%) rotate(18deg) translateX(-70vw); opacity: 0; }
        12%  { opacity: 0.55; }
        55%  { opacity: 0.35; }
        100% { transform: translate(-50%, -50%) rotate(18deg) translateX(70vw); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .splash { display: none; }
    }
</style>
</head>

<script>
    /* ================= splash de apertura ================= */
    const splash = document.getElementById('splash');
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function hideSplash() {
        if (splash.classList.contains('splash-hide')) return; // evita dobles clics
        const splashViolin = document.querySelector('.splash-violin');
        const splashSweep = document.querySelector('.splash-sweep');
        splashViolin.classList.add('fly');
        if (splashSweep) splashSweep.style.opacity = '0';

        setTimeout(() => { splash.classList.add('splash-hide'); }, 550);
        setTimeout(() => { splash.style.display = 'none'; }, 550 + 850);
    }

    if (prefersReduced) {
        splash.style.display = 'none';
    } else {
        splash.addEventListener('click', hideSplash); // por si tiene prisa
        setTimeout(hideSplash, 2000);
    }

    /* ================= cuerdas vibrando de fondo (tono pastel) ================= */
    const staffLines = [...document.querySelectorAll('.staff-line')];
    const baseY  = [20, 50, 80, 110, 140];
    const freqs  = [1.5, 2.1, 1.2, 2.6, 1.7];
    const speeds = [0.9, 1.4, 0.65, 1.7, 1.05];
    const idleAmp = 1.6;
    let amp = staffLines.map(() => idleAmp);
    let t = 0;

    function drawStaff() {
        t += 0.016;
        const segments = 48;
        staffLines.forEach((line, i) => {
            let d = 'M0,' + baseY[i].toFixed(2);
            for (let s = 1; s <= segments; s++) {
                const x = (1000 / segments) * s;
                const y = baseY[i] + Math.sin((x / 1000) * Math.PI * 2 * freqs[i] + t * speeds[i]) * amp[i];
                d += ' L' + x.toFixed(1) + ',' + y.toFixed(2);
            }
            line.setAttribute('d', d);
            amp[i] += (idleAmp - amp[i]) * 0.025;
        });
        requestAnimationFrame(drawStaff);
    }
    requestAnimationFrame(drawStaff);

    function pluckStaff(strength = 10) {
        amp = amp.map((a, i) => Math.max(a, strength + i * 0.6));
    }
    pluckStaff(12);

    /* ================= lógica de la pregunta ================= */
    let noClickCount = 0;
    const noPhrases = [
        "¿Segura? 🎻🥺",
        "Piénsalo otra vez...",
        "Esa no era la respuesta que querías dar 😌",
        "¿De verdad? 👀",
        "Tal vez deberías escuchar tu corazón... ❤️",
        "Creo que el violín está de mi lado en esto 🎻😂",
        "Una última oportunidad...",
        "Creo que en realidad quieres decir que sí ❤️"
    ];

    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const questionText = document.getElementById('question');
    const violinContainer = document.getElementById('violin');
    const field = document.getElementById('choiceField');

    function createFloatingElement(emoji, container) {
        const el = document.createElement('div');
        el.className = 'floating-element';
        el.innerText = emoji;
        const rect = container.getBoundingClientRect();
        const x = Math.random() * rect.width - (rect.width / 4);
        const y = Math.random() * rect.height - (rect.height / 2);
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        container.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    btnNo.addEventListener('click', () => {
        if (noClickCount < noPhrases.length) {
            const phraseIndex = noClickCount; // se guarda el índice actual: si no,
            questionText.style.opacity = 0;    // para cuando corra el setTimeout,
            setTimeout(() => {                 // noClickCount ya habrá cambiado
                questionText.innerText = noPhrases[phraseIndex];
                questionText.style.opacity = 1;
            }, 200);
        }

        if (noClickCount === 0) {
            // pasar a posicionamiento absoluto para poder moverlo libremente
            const r = btnNo.getBoundingClientRect();
            const fr = field.getBoundingClientRect();
            btnNo.style.position = 'absolute';
            btnNo.style.left = (r.left - fr.left) + 'px';
            btnNo.style.top = (r.top - fr.top) + 'px';
            btnYes.style.position = 'relative';
        }

        noClickCount++;
        const scaleNo = Math.max(0.4, 1 - (noClickCount * 0.1));
        const scaleYes = Math.min(1.8, 1 + (noClickCount * 0.15));
        btnNo.style.setProperty('--s', scaleNo);
        btnYes.style.setProperty('--s', scaleYes);
        btnNo.style.transform = `scale(${scaleNo})`;
        btnYes.style.transform = `scale(${scaleYes})`;

        // mover el "No" a una posición aleatoria dentro del campo
        const fr = field.getBoundingClientRect();
        const br = btnNo.getBoundingClientRect();
        const maxLeft = Math.max(0, fr.width - br.width);
        const maxTop = Math.max(0, fr.height - br.height);
        btnNo.style.left = (Math.random() * maxLeft) + 'px';
        btnNo.style.top = (Math.random() * maxTop) + 'px';

        // salto dramático + rebote del sí
        btnNo.classList.remove('kick'); void btnNo.offsetWidth; btnNo.classList.add('kick');
        btnYes.classList.remove('grow'); void btnYes.offsetWidth; btnYes.classList.add('grow');

        // las cuerdas de fondo reaccionan más fuerte cada vez
        pluckStaff(10 + noClickCount * 3);

        const notes = ['♪', '♫', '♩', '♬'];
        createFloatingElement(notes[Math.floor(Math.random() * notes.length)], violinContainer);

        if (noClickCount >= noPhrases.length) {
            btnNo.style.opacity = '0.3';
            btnNo.style.pointerEvents = 'none';
        }
    });

    const btnCopy = document.getElementById('btnCopy');
    btnCopy.addEventListener('click', async () => {
        const number = '+53 59334668';
        try {
            await navigator.clipboard.writeText(number);
        } catch (err) {
            // respaldo por si el navegador bloquea el acceso al portapapeles
            const temp = document.createElement('textarea');
            temp.value = number;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
        }
        btnCopy.textContent = '✅ ¡Copiado!';
        btnCopy.classList.add('copied');
        setTimeout(() => {
            btnCopy.textContent = '📋 Copiar número';
            btnCopy.classList.remove('copied');
        }, 1800);
    });

    btnYes.addEventListener('click', () => {
        pluckStaff(16);
        document.getElementById('screen-1').classList.remove('active');
        document.getElementById('screen-1').classList.add('hidden');

        setTimeout(() => {
            document.getElementById('screen-2').classList.remove('hidden');
            document.getElementById('screen-2').classList.add('active');
            triggerCelebration();
        }, 500);
    });

    function triggerCelebration() {
        const container = document.getElementById('screen-2');
        const elements = ['❤️', '🎻', '♪', '♫', '✨'];
        for (let i = 0; i < 30; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'exploding-heart';
                el.innerText = elements[Math.floor(Math.random() * elements.length)];
                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 150;
                el.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                el.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                el.style.left = '50%';
                el.style.top = '30%';
                container.appendChild(el);
                setTimeout(() => el.remove(), 1500);
            }, i * 50);
        }
    }
</script>

</body>
</html>
